<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 8</title>
</head>
<body>
    <h1>Formulário</h1>

    <p>
        <label for="inum">Número: </label>
        <input type="number" name="num" id="inum" min="0" max="50" required oninput="isoma.innerHTML = Number(inum.value) + Number(inum2.value)">
    </p>

    <p>
        <label for="inum2">Número: </label>
        <input type="number" name="num2" id="inum2" min="0" max="50" required oninput="isoma.innerHTML = Number(inum.value) + Number(inum2.value)">
    </p>

    <p>
        <label for="isoma">Soma: </label>
        <output id="isoma">0</output>
    </p>

    <hr>

    <p>
        <label for="inumero">Numéro: </label>
        <input type="range" name="numero" id="inumero" min="0" max="5" oninput="ival.innerHTML = Number(inumero.value)">
        <output id="ival">5</output>
    </p>


    <hr>

    <p>
        <label for="iano">Qual ano você nasceu? </label>
        <input type="number" name="ano" id="iano" min="1900" max="2020" oninput="calcidade()">
    </p>

    <p>
        <label for="iidade">Idade: </label>
        <output id="iidade">0</output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

    <script>
        function calcidade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
